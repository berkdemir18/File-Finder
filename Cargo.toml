[workspace]
members = [
    "shared",
    "file-finder-service",
    "file-finder-ui/src-tauri",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
